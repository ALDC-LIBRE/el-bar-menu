<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Bejuco | Tapas & Cervezas - Carta Digital</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brutalDark: '#264434',
                        brutalCard: '#1d3427',
                        brutalBorder: '#375a46',
                        leafAccent: '#F3EFE0',
                        plantGreen: '#182e22',
                        earthBrown: '#8B5A2B'
                    },
                    fontFamily: {
                        sans: ['"Space Mono"', 'monospace'],
                        title: ['"Syne"', 'sans-serif'],
                        logo: ['"Caveat"', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #264434;
            color: #F3EFE0;
        }
        .brutal-shadow {
            box-shadow: 4px 4px 0px #13241b;
        }
        .brutal-shadow-sm {
            box-shadow: 2px 2px 0px #13241b;
        }
        .brutal-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #13241b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-leafAccent selection:text-brutalDark">

    <!-- HEADER CON LOGOTIPO Y BOTÓN DE RESERVA -->
    <header class="border-b-4 border-brutalBorder bg-brutalDark sticky top-0 z-40 px-4 py-4 md:py-5">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 text-center sm:text-left">
                <div>
                    <h1 class="font-logo text-4xl md:text-5xl tracking-wide text-leafAccent lowercase font-bold flex items-center gap-1 drop-shadow-sm">
                        .bejuco
                    </h1>
                    <p class="text-[11px] tracking-widest text-emerald-200/80 uppercase font-mono">Tapas • Cervezas • Entorno Rural</p>
                </div>
            </div>

            <!-- Botón de Reserva de Mesa por WhatsApp -->
            <a id="headerWhatsAppBtn" href="#" target="_blank" class="bg-leafAccent text-brutalDark border-2 border-black px-4 py-2.5 text-xs font-bold uppercase brutal-shadow brutal-btn transition-all flex items-center gap-2">
                <span class="text-base">💬</span>
                <span>Reservar Mesa</span>
            </a>
        </div>
    </header>

    <!-- SECCIÓN DE AVISO DESTACADO -->
    <section class="max-w-4xl w-full mx-auto px-4 mt-6">
        <div id="noticeBanner" class="bg-brutalCard border-2 border-leafAccent p-6 brutal-shadow relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 text-leafAccent/5 pointer-events-none">
                <svg class="w-40 h-40" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="flex items-center gap-2 text-leafAccent text-xs font-bold tracking-widest uppercase mb-1">
                <span class="inline-block w-2 h-2 bg-leafAccent animate-ping"></span>
                Aviso Destacado
            </div>
            <h2 id="noticeTitleDisplay" class="font-title text-2xl md:text-3xl font-extrabold text-leafAccent uppercase tracking-wide">Cargando...</h2>
            <p id="noticeSubtitleDisplay" class="text-emerald-200 text-sm md:text-base font-mono mt-1">...</p>
        </div>
    </section>

    <!-- CONTENIDO PRINCIPAL DE LA CARTA -->
    <main class="max-w-4xl w-full mx-auto px-4 py-6 flex-grow">
        
        <!-- FILTROS Y TASA DE CAMBIO -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-4 mb-8">
            <div id="categoryTabs" class="flex flex-wrap gap-2">
                <button onclick="filterCategory('todas')" class="cat-btn active bg-leafAccent text-brutalDark border-2 border-brutalBorder px-4 py-2 text-xs font-bold uppercase brutal-shadow-sm transition-all">Todas</button>
                <button onclick="filterCategory('tapas')" class="cat-btn bg-brutalCard text-gray-200 border-2 border-brutalBorder px-4 py-2 text-xs font-bold uppercase brutal-shadow-sm transition-all">Tapas</button>
                <button onclick="filterCategory('cervezas')" class="cat-btn bg-brutalCard text-gray-200 border-2 border-brutalBorder px-4 py-2 text-xs font-bold uppercase brutal-shadow-sm transition-all">Cervezas</button>
                <button onclick="filterCategory('tragos')" class="cat-btn bg-brutalCard text-gray-200 border-2 border-brutalBorder px-4 py-2 text-xs font-bold uppercase brutal-shadow-sm transition-all">Tragos</button>
            </div>

            <div class="flex items-center justify-between sm:justify-end gap-3 bg-brutalCard border-2 border-brutalBorder px-3 py-2">
                <span id="exchangeRateLabel" class="text-xs font-mono text-leafAccent font-bold">1 USD = ... CUP</span>
                <span class="text-xs font-mono text-emerald-300/70">Base CUP</span>
            </div>
        </div>

        <!-- BUSCADOR -->
        <div class="mb-8">
            <div class="relative">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Buscar en la carta..." class="w-full bg-brutalCard border-2 border-brutalBorder px-4 py-3 text-sm text-leafAccent placeholder-emerald-300/40 focus:outline-none focus:border-leafAccent brutal-shadow-sm font-mono">
                <span class="absolute right-4 top-3.5 text-emerald-300/60">🔍</span>
            </div>
        </div>

        <!-- LISTADO DE PRODUCTOS -->
        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-12 text-emerald-200/60 font-mono">Conectando con Firebase...</div>
        </div>

    </main>

    <!-- BOTÓN FLOTANTE DE PANEL ADMIN -->
    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="openAdminLogin()" class="bg-brutalCard text-leafAccent border-2 border-leafAccent px-4 py-3 text-xs font-bold uppercase brutal-shadow brutal-btn transition-all flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-
